---
name: CI
run-name: "${{ github.event_name == 'pull_request' && format('CI: {0}', github.event.pull_request.title) || '' }}"

on:
  push:
    branches:
      - master
      - 'ver/**'
  pull_request:
    branches:
      - master
      - 'ver/**'

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        node:
          - '22'
          - '24'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
        with:
          node_version: ${{ matrix.node }}
      - name: Test
        run: npm test
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        node:
          - '22'
          - '24'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
        with:
          node_version: ${{ matrix.node }}
      - name: Lint
        run: npm run lint
